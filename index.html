<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stoixima Insider</title>

<style>
body{margin:0;font-family:Arial;background:#0f1114;color:#fff}
header{padding:16px;background:#151619;display:flex;justify-content:space-between;align-items:center}
.container{max-width:1100px;margin:20px auto;padding:0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:#151619;border-radius:16px;padding:14px}
.bet-image{width:100%;border-radius:12px;margin-top:10px}
.blurred{filter:blur(16px)}
.vip-lock{
  margin-top:10px;
  padding:12px;
  text-align:center;
  border:1px dashed rgba(255,255,255,.4);
  border-radius:12px;
  cursor:pointer;
  font-weight:700
}
.modal{
  position:fixed;inset:0;
  background:rgba(0,0,0,.7);
  display:none;align-items:center;justify-content:center
}
.modal-card{
  background:#151619;
  padding:20px;
  border-radius:16px;
  width:100%;
  max-width:400px
}
input,select{
  width:100%;
  padding:10px;
  margin-bottom:10px;
  border-radius:8px;
  border:0
}
button{cursor:pointer}
.admin-btn{
  position:fixed;
  right:14px;
  bottom:14px;
  border-radius:50%;
  padding:12px;
  font-size:18px
}
</style>
</head>

<body>

<header>
  <b>Stoixima <span style="color:#e91e63">Insider</span></b>
  <button id="addBtn" style="display:none">➕ Προσθήκη</button>
</header>

<div class="container">
  <div id="cards" class="grid"></div>
</div>

<div id="modal" class="modal">
  <div class="modal-card">
    <h3>Νέα Πρόβλεψη</h3>
    <input id="home" placeholder="Home">
    <input id="away" placeholder="Away">
    <input id="league" placeholder="Λίγκα">
    <input type="file" id="imageInput" accept="image/*">
    <select id="lockedSel">
      <option value="locked">Κλειδωμένο</option>
      <option value="free">Ανοικτό</option>
    </select>
    <button id="save">Αποθήκευση</button>
  </div>
</div>

<button id="adminTrigger" class="admin-btn">🛠️</button>

<script>
const STORAGE="si_data_final_v1";
const ADMIN_HASH="240be518fabd2724ddb6f04eeb1da5967448d7e831c08c8fa822809f74c720a9";

/* TELEGRAM */
const TG_BOT="8503882712:AAG_sF4-LhoeYyL1mF4VKW7UtyiBv6Gk-WA";
const TG_CHAT="5734258452";

/* STATE */
let data=JSON.parse(localStorage.getItem(STORAGE)||"[]");
let isAdmin=localStorage.getItem("si_admin")==="1";

/* ELEMENTS */
const cards=document.getElementById("cards");
const modal=document.getElementById("modal");
const addBtn=document.getElementById("addBtn");

/* STORAGE */
function save(){localStorage.setItem(STORAGE,JSON.stringify(data));}

/* RENDER */
function render(){
  cards.innerHTML="";
  data.forEach(m=>{
    const c=document.createElement("div");
    c.className="card";
    c.innerHTML=`
      <b>${m.home} vs ${m.away}</b><br>
      <small>${m.league}</small>
      <img src="${m.image}" class="bet-image ${m.locked==="locked"?"blurred":""}">
      ${m.locked==="locked"
        ? `<div class="vip-lock">🔒 Ξεκλείδωμα Πρόβλεψης — 24€</div>`
        : ""}
    `;
    if(m.locked==="locked"){
      c.querySelector(".vip-lock").onclick=()=>{
        location.href=
        "https://www.paypal.com/donate/?business=phonegenius88@gmail.com&amount=24&currency_code=EUR&return="+
        encodeURIComponent(location.href+"?unlocked=1&id="+m.id);
      };
    }
    cards.appendChild(c);
  });
}

/* SAVE NEW */
document.getElementById("save").onclick=()=>{
  const img=imageInput.files[0];
  if(!img){alert("Ανέβασε φωτογραφία");return;}

  const r=new FileReader();
  r.onload=()=>{
    const rec={
      id:Date.now(),
      home:home.value,
      away:away.value,
      league:league.value,
      image:r.result,
      locked:lockedSel.value
    };
    data.push(rec);
    save();
    render();
    modal.style.display="none";

    /* SEND TO TELEGRAM */
    fetch(`https://api.telegram.org/bot${TG_BOT}/sendPhoto`,{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify({
        chat_id:TG_CHAT,
        photo:rec.image,
        caption:`${rec.home} vs ${rec.away}\n${rec.league}`
      })
    });
  };
  r.readAsDataURL(img);
};

/* ADMIN LOGIN */
adminTrigger.onclick=async()=>{
  const pass=prompt("Admin κωδικός:");
  if(!pass)return;
  const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(pass));
  const hash=[...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
  if(hash===ADMIN_HASH){
    isAdmin=true;
    localStorage.setItem("si_admin","1");
    addBtn.style.display="inline-block";
    alert("Admin ενεργό");
  } else {
    alert("Λάθος κωδικός");
  }
};

/* UI */
addBtn.onclick=()=>modal.style.display="flex";
modal.onclick=e=>{if(e.target===modal)modal.style.display="none"};

/* UNLOCK AFTER PAYPAL */
(function(){
  const p=new URLSearchParams(location.search);
  if(p.get("unlocked")==="1"){
    const rec=data.find(x=>String(x.id)===p.get("id"));
    if(rec) rec.locked="free";
    save();
    history.replaceState({},'',location.pathname);
  }
})();

render();
if(isAdmin) addBtn.style.display="inline-block";
</script>

</body>
</html>
